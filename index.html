<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Mundial - Legal</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #00c853;
      --dark: #0a0f0a;
      --card: #111811;
      --border: #1e2e1e;
      --text: #d4e8d4;
      --muted: #6b8c6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      padding: 2rem 1rem 4rem;
    }

    header, main, footer {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 3rem;
      border-bottom: 2px solid var(--green);
      padding-bottom: 1.5rem;
    }

    header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 2px;
      color: var(--green);
      line-height: 1;
    }

    header p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 0.875rem;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      color: var(--text);
      text-decoration: none;
    }

    a.card:hover { border-color: var(--green); }

    a.card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      letter-spacing: 1px;
      color: var(--green);
    }

    a.card p {
      color: var(--muted);
      font-size: 0.875rem;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    footer a { color: var(--green); text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <h1>Trivia Mundial</h1>
    <p>Información legal de la app</p>
  </header>

  <main>
    <a class="card" href="privacy-policy.html">
      <h2>Política de Privacidad</h2>
      <p>Qué datos recopilamos, para qué los usamos y cómo los protegemos.</p>
    </a>
    <a class="card" href="delete-account.html">
      <h2>Eliminar mi cuenta</h2>
      <p>Cómo eliminar tu cuenta y tus datos, desde la app o por email.</p>
    </a>
  </main>

  <footer>
    <p>&copy; 2026 Trivia Mundial &mdash; <a href="mailto:triviamundial.app@gmail.com">triviamundial.app@gmail.com</a></p>
  </footer>

</body>
</html>
